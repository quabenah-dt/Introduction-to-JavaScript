<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>

        <!-- Style -->
         <style>
            body {
                background-image: url("/station.jpg");
                background-size: cover;
                /* font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; */
                font-weight: bold;
                text-align: center;
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
            }

            h1 {
                margin-top: 10px;
                margin-bottom: 10px;
            }

            h2 {
                font-size: 50px;
                margin-top: 0;
                margin-bottom: 20px;
            }

            button {
                border: none;
                padding-top: 10px;
                padding-bottom: 10px;
                color: white;
                font-weight: bold;
                width: 200px;
                margin-bottom: 5px;
                border-radius: 5px;
                cursor: pointer;
                transition: .2s;
            }

            #increment-btn {
                background: darkred;
            }

            #increment-btn:active {
                background: rgb(245, 15, 15);
            }

            #save-btn {
                background: darkgreen;
            }

            #save-btn:active {
                background: rgb(10, 248, 10);
            }

         </style>


        <h1>People entered:</h1>
        <h2 id="count-el">0</h2>
        <!-- Create a INCREMENT button with the id="increment-btn" -->

        <button id="increment-btn" onclick="increament()">INCREMENT</button>

         <button id="save-btn" onclick="save()">SAVE</button>

         <p id="save-el">Previous entries: </p>

        <script src="index.js"></script>
    </body>
</html>
