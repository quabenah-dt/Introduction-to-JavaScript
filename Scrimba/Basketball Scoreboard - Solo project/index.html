<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">


    <title>Basketball Scoreboard</title>
</head>
<body>

<div class="main-cotainer">
    <div class="home-contaier">
        <h1>HOME</h1>
        <p id="home-score-screen">0</p>
        <div class="buttons">
            <button id="home-plus-one" class="addition-btn" onclick="homePlusOne()">+1</button>
            <button id="home-plus-two" class="addition-btn" onclick="homePlusTwo()">+2</button>
            <button id="home-plus-three" class="addition-btn" onclick="homePlusThree()">+3</button>
        </div>
    </div>

<div class="reset"><button class="reset-btn" onclick="resetScore()">Reset</button></div>

    <div class="guest-contaier">
        <h1>GUEST</h1>
        <p id="away-score-screen">0</p>
        <div class="buttons">
            <button class="addition-btn" onclick="awayPlusOne()">+1</button>
            <button class="addition-btn" onclick="awayPlusTwo()">+2</button>
            <button class="addition-btn" onclick="awayPlusThree()">+3</button>
        </div>
    </div>
</div>


<script src="/Scrimba/Basketball Scoreboard - Solo project/script.js"></script>
</body>
</html>
